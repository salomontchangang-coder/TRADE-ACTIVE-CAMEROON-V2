# ==============================================================================
# TRADE ACTIVE CAMEROON S.A. - NETLIFY CONFIGURATION
# Production deployment settings, security headers, redirects, and caching
# ==============================================================================

[build]
  publish = "."

# HTML Pretty URLs (/page instead of /page.html)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ------------------------------------------------------------------------------
# REDIRECTS & CLEAN ALIASES
# ------------------------------------------------------------------------------

[[redirects]]
  from = "/accueil"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/btp"
  to = "/metiers-btp.html"
  status = 200

[[redirects]]
  from = "/marques"
  to = "/marques-partenaires.html"
  status = 200

[[redirects]]
  from = "/academie"
  to = "/formation.html"
  status = 200

[[redirects]]
  from = "/a-propos"
  to = "/entreprise.html"
  status = 200

[[redirects]]
  from = "/projets"
  to = "/galerie.html"
  status = 200

[[redirects]]
  from = "/catalogues"
  to = "/equipements.html"
  status = 200

[[redirects]]
  from = "/catalogue"
  to = "/equipements.html"
  status = 200

# Custom 404 error page fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ------------------------------------------------------------------------------
# GLOBAL SECURITY HEADERS
# ------------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ------------------------------------------------------------------------------
# PERFORMANCE & CACHE CONTROL HEADERS
# ------------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
